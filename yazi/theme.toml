# Clean, minimal yazi theme — uses only standard terminal colors,
# so it follows your Terminal profile and works without truecolor.

[mgr]
cwd             = { fg = "darkgray" }
find_keyword    = { fg = "yellow", bold = true }
find_position   = { fg = "darkgray" }
symlink_target  = { fg = "darkgray", italic = true }
marker_copied   = { fg = "green",  bg = "green" }
marker_cut      = { fg = "red",    bg = "red" }
marker_marked   = { fg = "cyan",   bg = "cyan" }
marker_selected = { fg = "yellow", bg = "yellow" }
marker_symbol   = "▎"
count_copied    = { fg = "black", bg = "green" }
count_cut       = { fg = "black", bg = "red" }
count_selected  = { fg = "black", bg = "yellow" }
border_symbol   = " "
border_style    = { fg = "darkgray" }

[tabs]
active    = { fg = "black", bg = "white", bold = true }
inactive  = { fg = "darkgray" }
sep_inner = { open = " ", close = " " }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "black", bg = "white", bold = true }
normal_alt  = { fg = "darkgray" }
select_main = { fg = "black", bg = "yellow", bold = true }
select_alt  = { fg = "darkgray" }
unset_main  = { fg = "black", bg = "red", bold = true }
unset_alt   = { fg = "darkgray" }

[indicator]
parent  = { fg = "white", bg = "darkgray" }
current = { fg = "black", bg = "white", bold = true }
preview = { underline = true }
padding = { open = " ", close = " " }

[status]
overall    = {}
sep_left   = { open = "", close = " " }
sep_right  = { open = " ", close = "" }
perm_sep   = { fg = "darkgray" }
perm_type  = { fg = "darkgray" }
perm_read  = { fg = "darkgray" }
perm_write = { fg = "darkgray" }
perm_exec  = { fg = "darkgray" }
progress_label  = { bold = true }
progress_normal = { fg = "white", bg = "darkgray" }
progress_error  = { fg = "red", bg = "darkgray" }

[which]
border          = { fg = "darkgray" }
cand            = { fg = "white", bold = true }
rest            = { fg = "darkgray" }
desc            = { fg = "gray" }
separator_style = { fg = "darkgray" }

[confirm]
border = { fg = "darkgray" }
title  = { fg = "white", bold = true }

[spot]
border   = { fg = "darkgray" }
title    = { fg = "white", bold = true }
tbl_col  = { fg = "white" }
tbl_cell = { fg = "black", bg = "white" }

[pick]
border = { fg = "darkgray" }
active = { fg = "white", bold = true }

[input]
border   = { fg = "darkgray" }
selected = { fg = "black", bg = "white" }

[cmp]
border = { fg = "darkgray" }
active = { fg = "black", bg = "white" }

[tasks]
border  = { fg = "darkgray" }
hovered = { fg = "white", bold = true }

[help]
border  = { fg = "darkgray" }
chord   = { fg = "white", bold = true }
hovered = { fg = "black", bg = "white" }

[filetype]
rules = [
	{ url = "*", is = "orphan", fg = "red" },
	{ url = "*/", fg = "blue", bold = true },
	{ url = "*", is = "exec", fg = "green" },
	{ mime = "**/image/*", fg = "magenta" },
	{ mime = "**/{audio,video}/*", fg = "magenta" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma}", fg = "yellow" },
	{ mime = "**/application/pdf", fg = "cyan" },
]

# No icons — cleaner, and avoids boxes in Terminal.app
[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = []
